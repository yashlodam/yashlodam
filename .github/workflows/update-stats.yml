name: Update GitHub Stats Snapshot

on:
  schedule:
    - cron: "0 0 * * *" # Every day at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download GitHub Stats
        run: |
          curl -L --fail \
          "https://github-readme-stats.vercel.app/api?username=yashlodam&show_icons=true&theme=tokyonight&hide_border=true" \
          -o assets/github-stats.svg.tmp

      - name: Download Top Languages
        run: |
          curl -L --fail \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=yashlodam&layout=compact&theme=tokyonight&hide_border=true" \
          -o assets/top-langs.svg.tmp

      - name: Validate SVG files
        run: |
          for file in assets/github-stats.svg.tmp assets/top-langs.svg.tmp
          do
            if grep -qiE "rate limit|error|something went wrong" "$file"; then
              echo "Invalid SVG detected."
              exit 1
            fi

            grep -q "<svg" "$file"
          done

      - name: Replace old snapshots
        run: |
          mv assets/github-stats.svg.tmp assets/github-stats.svg
          mv assets/top-langs.svg.tmp assets/top-langs.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore: update GitHub stats"

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref_name }}
